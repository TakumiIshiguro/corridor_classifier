  minimum_duration_seconds: 0.5
  padding_seconds: 0.25
  maximum_pose_gap_seconds: 0.5
  post_turn_next_label_max_seconds: 6.0
  turning_gap_bridge_max_seconds: 1.5

depth_generation:
  # Empty selects every session in dataset_types.
  dataset_types: [train]
  session_names: [session_20260811_010115]
  unidepth_config_file: ../UniDepth/unidepth_ros/config/unidepth.yaml
  stamp_tolerance_seconds: 0.01
