model:
  # DINOv2 ViT-S/14 is the smallest official DINOv2 backbone.
  model_name: vit_small_patch14_dinov2.lvd142m
  checkpoint_path: weights/corridor_classifier.pth
  input_size: [224, 224]
  num_classes: 8
  class_names:
    - straight_road
    - dead_end
    - corner_right
    - corner_left
    - cross_road
    - 3_way_right
    - 3_way_center
    - 3_way_left
  device: auto
  use_fp16: true
  strict_checkpoint: true

runtime:
  inference_rate: 4.0
