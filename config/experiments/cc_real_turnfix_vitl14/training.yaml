dataset:
  # Same recipe and dataset as cc_real_turnfix; only the DINOv2
  # backbone differs (vit_large_patch14_dinov2.lvd142m).
  # Same recipe as cc_real_no_aug; only the dataset differs.
  # real_turnfix re-runs turn detection with
  # turning_gap_bridge_max_seconds 4.0 (see
  # config/experiments/real_turning_bridge), which merges the two
  # turns that a 2.8 s / 3.0 s dip below the 0.20 rad/s gate had
  # split in two. Turning segments then match sim exactly: 24
  # segments and 106 label switches, against 26 and 110 before.
  train_data_dir: dataset/corridor/real_turnfix/train
  train_session_names:
  - a_f
  - g
  - h
  train_sequence_step: 4
  num_workers: 4
training:
  epochs: 16
  batch_size: 8
  use_test: false
  checkpoint_metric: train_passage_macro_f1
  use_amp: true
  seed: 0
  freeze_backbone_epochs: 16
  unfreeze_schedule: []
  pretrained_weights_path: weights/dinov2_vitl14_pretrain.pth
  run_root: runs/experiments/cc_real_turnfix_vitl14
  maximum_positive_weight: 2.0
  direction_loss_weight: 1.0
  turning_loss_weight: 1.0
  augmentation:
    color_jitter:
      brightness: 0.0
      contrast: 0.0
      saturation: 0.0
      hue: 0.0
    grayscale_probability: 0.0
    blur_probability: 0.0
    depth_scale_jitter: 0.0
    horizontal_flip_probability: 0.0
optimizer:
  name: adamw
  head_learning_rate: 2.0e-05
  backbone_learning_rate: 1.0e-06
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
scheduler:
  name: cosine
  warmup_epochs: 2
  warmup_start_factor: 0.1
  min_learning_rate_ratio: 0.1
