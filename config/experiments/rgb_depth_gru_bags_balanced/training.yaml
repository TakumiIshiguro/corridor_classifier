dataset:
  train_data_dir: dataset/corridor/bags_all_train/train
  train_session_names: [a_f, g, h]
  test_data_dir: dataset/corridor/bags_i_n_test/test
  test_session_names: [i, j, k, l, m, n]
  num_workers: 4

training:
  epochs: 8
  batch_size: 8
  use_test: true
  use_amp: true
  seed: 0
  freeze_backbone_epochs: 2
  unfreeze_schedule:
    - epoch: 3
      last_blocks: 2
  pretrained_weights_path: weights/dinov2_vits14_pretrain.pth
  run_root: runs/experiments/rgb_depth_gru_bags/balanced
  checkpoint_metric: test_macro_f1
  class_weighting: inverse_sqrt
  maximum_class_weight: 4.0
  sampling_strategy: class_session_inverse_sqrt
  maximum_sampling_class_factor: 4.0
  maximum_sampling_session_factor: 4.0
  augmentation:
    horizontal_flip_probability: 0.5
    color_jitter:
      brightness: 0.35
      contrast: 0.35
      saturation: 0.25
      hue: 0.04
    grayscale_probability: 0.1
    blur_probability: 0.15
    depth_scale_jitter: 0.15

optimizer:
  name: adamw
  head_learning_rate: 0.00005
  backbone_learning_rate: 0.000001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epsilon: 1.0e-8

scheduler:
  name: cosine
  warmup_epochs: 1
  warmup_start_factor: 0.1
  min_learning_rate_ratio: 0.1
