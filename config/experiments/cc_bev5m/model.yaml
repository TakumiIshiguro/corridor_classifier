model:
  architecture: rgb_bev_gru
  output_mode: passage_directions
  model_name: vit_small_patch14_dinov2.lvd142m
  input_size:
  - 224
  - 224
  num_classes: 9
  class_names:
  - straight_road
  - dead_end
  - corner_right
  - corner_left
  - cross_road
  - 3_way_right
  - 3_way_center
  - 3_way_left
  - turning
  direction_names:
  - front
  - left
  - right
  direction_thresholds:
  - 0.5
  - 0.5
  - 0.5
  turning_class_name: turning
  device: auto
  use_fp16: true
  strict_checkpoint: true
  # RGB + BEV, no depth branch: the BEV grid is derived from the same
  # depth map, so feeding both is redundant -- and the depth branch
  # was already shown to contribute little (shuffling depth across
  # samples cost only 0.009 macro F1, see
  # config/experiments/DEPTH_MODALITY_COMPARISON.md).
  # BEV occupancy-grid branch: a small CNN over the (2, forward_bins,
  # lateral_bins) grid from scripts/add_bev_grid_to_dataset.py, concatenated
  # with the RGB features before the existing fusion layer. Everything else
  # matches cc_aug0_none, so the difference under test is this branch alone.
  use_bev: true
  bev_feature_dim: 64
  bev_pool_size: 1
  # Binary occupancy (0/1) instead of raw point counts: counts track
  # 1/distance^2 (532 points per cell at 0.8 m against 8 at 7.5 m,
  # log-log correlation -0.94), re-encoding the distance the cell
  # index already carries plus per-environment surface/density
  # variation.
  bev_binary: true
  # 0.1-5.1 m forward x +-3.5 m lateral on a 50x70 grid: 0.10 m square
  # cells, against the earlier 0.1-8 m / 64x64 grid's 0.12 m. Labels treat a
  # corridor as straight even when a wall sits 5 m ahead, so the far half of
  # the 8 m grid carried little label-relevant signal while costing
  # resolution in the range that decides the call.
  bev_min_points: 80

  # 64x64 grid (0.12 x 0.13 m square cells) instead of the first
  # attempt's 16x32, whose forward cells were twice as coarse as its
  # lateral ones and resolved a 1.5 m corridor in only 6 cells.

  dino_readout: last_cls_regional3
  # Flattened (no variants block): this config has exactly one architecture.
  checkpoint_path: weights/diagnostics/cc_bev5m.pth
  sequence_length: 3
  frame_stride: 4
  maximum_gap_seconds: 0.4
  use_depth: false
  use_gru: true
  fusion_dim: 256
  gru_hidden_size: 256
  gru_num_layers: 1
runtime:
  inference_rate: 4.0
