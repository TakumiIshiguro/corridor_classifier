dataset:
  train_data_dir: dataset/corridor/bags_turning/train
  train_session_names:
  - a_f
  - g
  - h
  train_sequence_step: 4
  # Diagnostic only: i-n is evaluated every epoch so the overfitting curve
  # is visible, but checkpoint_metric stays train_passage_macro_f1 below so
  # nothing is ever selected on i-n.
  #
  # Identical to cc_aug0_none_diag except epochs 16 -> 7. Every run that can
  # see an unseen area peaks at epoch 6-9 and loses 0.01-0.07 macro F1 by
  # epoch 16, so training should stop earlier. Two ways to do that differ:
  # taking the epoch-6 snapshot out of a 16-epoch cosine (measured: 0.7608)
  # leaves the learning rate still high at that point, whereas shortening
  # the schedule here decays it to min_learning_rate_ratio by epoch 7. This
  # config measures the second option so the real dataset -- which has no
  # unseen-area split to measure on -- can inherit whichever wins.
  test_data_dir: dataset/corridor/bags_i_n_test/test
  test_session_names: [i, j, k, l, m, n]
  num_workers: 4
training:
  epochs: 7
  batch_size: 8
  use_test: true
  checkpoint_metric: train_passage_macro_f1
  use_amp: true
  seed: 1
  freeze_backbone_epochs: 7
  unfreeze_schedule: []
  pretrained_weights_path: weights/dinov2_vits14_pretrain.pth
  run_root: runs/experiments/cc_epoch7_diag_seed1
  maximum_positive_weight: 2.0
  direction_loss_weight: 1.0
  turning_loss_weight: 1.0
  augmentation:
    color_jitter:
      brightness: 0.0
      contrast: 0.0
      saturation: 0.0
      hue: 0.0
    grayscale_probability: 0.0
    blur_probability: 0.0
    depth_scale_jitter: 0.0
    horizontal_flip_probability: 0.0
optimizer:
  name: adamw
  head_learning_rate: 2.0e-05
  backbone_learning_rate: 1.0e-06
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
scheduler:
  name: cosine
  warmup_epochs: 2
  warmup_start_factor: 0.1
  min_learning_rate_ratio: 0.1
