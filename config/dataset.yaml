paths:
  dataset_dir: dataset/corridor

collection:
  source: bag
  bag_path: /home/takumi/bags/2026-08-11-00-08-45.bag
  dataset_type: train
  session_name: ""
  sample_dt: 0.25
  label_timeout: 0.5
  image_format: jpg
  jpeg_quality: 95

turn_detection:
  enabled: true
  source_num_classes: 8
  class_name: turning
  pose_topic: /mcl_pose
  angular_speed_threshold_rad_s: 0.20
