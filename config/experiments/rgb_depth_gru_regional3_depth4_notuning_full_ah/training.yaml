dataset:
  train_data_dir: dataset/corridor/bags_turning/train
  # All of a-h (a_f = sessions a-f combined, plus g and h) now goes into
  # training, per explicit instruction: g/h were previously held out as an
  # in-training validation split (used for checkpoint selection and
  # threshold tuning), which meant the model never saw dead_end even
  # though it is nominally part of "a-h" (dead_end happens to be
  # concentrated in g/h; a_f alone has zero dead_end examples).
  train_session_names: [a_f, g, h]
  train_sequence_step: 4
  num_workers: 4

training:
  epochs: 16
  batch_size: 8
  # No held-out split remains within a-h to select a checkpoint from
  # without leaking into what the model was trained on, and i-n stays
  # untouched per the "spend held-out data once" discipline. Save the
  # final epoch instead of a validation-selected "best" epoch.
  use_test: false
  checkpoint_metric: train_passage_macro_f1
  use_amp: true
  seed: 0
  freeze_backbone_epochs: 16
  unfreeze_schedule: []
  pretrained_weights_path: weights/dinov2_vits14_pretrain.pth
  run_root: runs/experiments/rgb_depth_gru_bags_passage_directions_regional3_depth4_notuning_full_ah
  maximum_positive_weight: 2.0
  direction_loss_weight: 1.0
  turning_loss_weight: 1.0
  augmentation:
    horizontal_flip_probability: 0.5
    color_jitter:
      brightness: 0.35
      contrast: 0.35
      saturation: 0.25
      hue: 0.04
    grayscale_probability: 0.1
    blur_probability: 0.15
    depth_scale_jitter: 0.15

optimizer:
  name: adamw
  head_learning_rate: 0.00002
  backbone_learning_rate: 0.000001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epsilon: 1.0e-8

scheduler:
  name: cosine
  warmup_epochs: 2
  warmup_start_factor: 0.1
  min_learning_rate_ratio: 0.1
