  bag_path: /home/takumi/bags/a-f.bag
  dataset_type: train
  session_name: ""
  sample_dt: 0.25
  label_timeout: 0.5
  image_format: jpg
  jpeg_quality: 95

depth_generation:
  dataset_types: [train, test]
  session_names: []
  unidepth_config_file: ../UniDepth/unidepth_ros/config/unidepth.yaml
  stamp_tolerance_seconds: 0.01
