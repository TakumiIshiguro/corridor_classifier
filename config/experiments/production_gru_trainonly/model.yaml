model:
  architecture: rgb_depth_gru
  output_mode: passage_directions
  model_name: vit_small_patch14_dinov2.lvd142m
  input_size: [224, 224]
  num_classes: 9
  class_names:
    - straight_road
    - dead_end
    - corner_right
    - corner_left
    - cross_road
    - 3_way_right
    - 3_way_center
    - 3_way_left
    - turning
  direction_names: [front, left, right]
  # Thresholds tuned via scripts/tune_passage_thresholds.py on g,h no
  # longer apply: g,h are now part of the training set below (see
  # checkpoint_path), so evaluating thresholds on them would be leakage.
  # Flat 0.5 until a leak-free way to retune is decided (i-n is
  # deliberately not used for this -- "spend held-out data once").
  direction_thresholds: [0.5, 0.5, 0.5]
  turning_class_name: turning
  device: auto
  use_fp16: true
  strict_checkpoint: true
  dino_readout: last_cls_regional3
  variants:
    rgb_depth_gru:
      # Trained on all of a-h (a_f + g + h combined; see
      # config/experiments/rgb_depth_gru_regional3_depth4_notuning_full_ah).
      # The previous checkpoint trained on a_f only, with g/h held out as
      # an in-training validation split, meant the model never saw a
      # single dead_end example (dead_end happens to be concentrated in
      # g/h; a_f alone has zero).
      checkpoint_path: weights/production/gru_regional3_depth4_full_ah.pth
      sequence_length: 3
      frame_stride: 4
      # At 4 Hz inference (0.25 s period), 0.4 s tolerated essentially zero
      # missed frames before discarding the GRU's temporal buffer, forcing a
      # full 9-frame (~2.25 s) recollection after any brief camera/publish
      # hiccup, not just after a real turn. Widen the margin so a couple of
      # dropped frames don't trigger an unnecessary reset.
      maximum_gap_seconds: 0.8
      use_depth: true
      use_gru: true
      depth_feature_dim: 128
      depth_pool_size: 4
      fusion_dim: 256
      gru_hidden_size: 256
      gru_num_layers: 1
      depth_min_m: 0.1
      depth_max_m: 10.0

runtime:
  inference_rate: 4.0
